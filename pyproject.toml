[project]
name = "summer-movie-wager-data"
version = "0.1.0"
readme = "README.md"
authors = [{name = "Joshua Peek"}]
requires-python = ">=3.10"
dependencies = [
    "click>=8.4.2,<9.0",
    "parsel>=1.11.0,<2.0",
    "requests>=2.34.2,<3.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0,<3.0",
    "ruff>=0.16.1",
    "types-requests>=2.33.0.20260712,<3.0",
]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.mypy]
strict = true
